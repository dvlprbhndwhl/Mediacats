kind = "web"
previewPath = "/"
title = "MEDIACATS"
description = "A premium editorial landing website for MEDIACATS, an SEO and organic acquisition company for iGaming brands in high-value Tier-1 and Tier-2 markets."
version = "1.0.0"
id = "artifacts/mediacats"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19523

[services.development]
run = "pnpm --filter @workspace/mediacats run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mediacats", "run", "build" ]
serve = "static"
publicDir = "artifacts/mediacats/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19523"
BASE_PATH = "/"
